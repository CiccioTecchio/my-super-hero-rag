# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  main:
    desc: Run the application
    cmds:
      - .venv/bin/python __main__.py {{.CLI_ARGS}}

  similarity-matrix:
    desc: Generate the question-document similarity matrix
    cmds:
      - .venv/bin/python similarity_matrix.py {{.CLI_ARGS}}
